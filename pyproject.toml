[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flaky-test-detective"
version = "0.1.0"
description = "Offline JUnit XML flake and intermittent failure analyzer"
requires-python = ">=3.11"

[project.scripts]
flaky-test-detective="flaky_test_detective.cli:main"

[tool.setuptools.packages.find]
where=["src"]
